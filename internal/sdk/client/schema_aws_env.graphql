query GetAWSEnv($name: String!) {
  awsEnv(name: $name) {
    name
    spec {
      ...AWSEnvSpecFragment
    }
    specRevision
  }
}

query GetAWSEnvStatus($name: String!) {
  awsEnv(name: $name) {
    name
    specRevision
    status {
      appliedSpecRevision
      pendingDelete
      loadBalancers {
        internal {
          endpointServiceName
        }
      }
      peeringConnections {
        id
        vpcID
      }
      awsResources {
        id
        arn
        name
      }
      errors {
        code
        message
      }
    }
  }
}

mutation CreateAWSEnv($input: CreateAWSEnvInput!) {
  createAWSEnv(input: $input) {
    mutationId
    spec {
      ...AWSEnvSpecFragment
    }
    specRevision
  }
}

mutation UpdateAWSEnv($input: UpdateAWSEnvInput!) {
  updateAWSEnv(input: $input) {
    mutationId
    spec {
      ...AWSEnvSpecFragment
    }
    specRevision
  }
}

mutation DeleteAWSEnv($input: DeleteAWSEnvInput!) {
  deleteAWSEnv(input: $input) {
    mutationId
    pendingMFA
  }
}

fragment AWSEnvSpecFragment on AWSEnvSpec {
  loadBalancers {
    public {
      enabled
      sourceIPRanges
      crossZone
    }
    internal {
      enabled
      sourceIPRanges
      crossZone
      endpointServiceAllowedPrincipals
      endpointServiceSupportedRegions
    }
  }
  loadBalancingStrategy
  customDomain
  customDomains
  nodeGroups {
    name
    nodeType
    zones
    capacityPerZone
    reservations
  }
  maintenanceWindows {
    name
    enabled
    hour
    lengthInHours
    days
  }
  region
  NAT
  zones
  cidr
  awsAccountID
  permissionsBoundaryPolicyArn
  resourcePrefix
  kmsKeyARN
  peeringConnections {
    awsAccountID
    vpcID
    vpcRegion
  }
  endpoints {
    serviceName
    alias
    privateDNS
  }
  tags {
    key
    value
  }
  cloudConnect,
  externalBuckets {
    name
    kmsKeyARN
  }
  backups {
    customBucket {
      name
      region
      roleARN
    }
  }
  iceberg {
    catalogs {
      name
      type
      customS3TableBucketARN
      anonymousAccessEnabled
      maintenance {
        enabled
      }
      watches {
        table
        pathsRelativeToTableLocation
      }
    }
  }
  eksLogging
  metricsEndpoint {
    enabled
    sourceIPRanges
  }
  datadog {
    enabled
    domain
    logsEnabled
    metricsEnabled
  }
  mfa
  clickHouseClusters {
    name
    image
    instanceType
    zones
    shards
    replicas
    stopped
    keeper
    disk {
      sizeInGiB
      iops
      throughputInMiBps
    }
    extraDisks {
      name
      sizeInGiB
      iops
      throughputInMiBps
    }
    users {
      name
      profile
      quota
      networks {
        ips
      }
      accessManagement
      namedCollectionControl
      showNamedCollectionsSecrets
      databases {
        name
      }
      grants
      password {
        type
      }
    }
    profiles {
      name
      settings {
        key
        value
      }
    }
    quotas {
      name
      keyedBy
      ipv4PrefixBits
      ipv6PrefixBits
      intervals {
        duration
        queries
        querySelects
        queryInserts
        errors
        resultRows
        resultBytes
        readRows
        readBytes
        writtenBytes
        executionTime
        failedSequentialAuthentications
        queriesPerNormalizedHash
      }
    }
    serverSettings {
      key
      value
    }
  }
  clickHouseKeepers {
    name
    instanceType
    zones
    replicas
    stopped
    disk {
      sizeInGiB
      iops
      throughputInMiBps
    }
  }
}
